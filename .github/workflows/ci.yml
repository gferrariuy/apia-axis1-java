name: Continuous Integration

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

env:
  MAVEN_OPTS: -Dmaven.wagon.httpconnectionManager.ttlSeconds=25 -Dmaven.wagon.http.retryHandler.count=3

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        java: [ 8 ]
    name: "Java ${{ matrix.java }}"
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    - name: Cache Maven Repository
      uses: actions/cache@v3
      with:
        path: ~/.m2/repository
        key: maven-java-${{ matrix.java }}-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          maven-java-${{ matrix.java }}-
          maven-
    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: ${{ matrix.java }}
    - name: Set up Maven 3.9.11
      shell: bash
      run: |
        # The integration-test policy does not allow Maven 3.10 to read user extensions.
        maven_dir="$(mktemp -d "$RUNNER_TEMP/maven.XXXXXX")"
        cd "$maven_dir"
        archive=apache-maven-3.9.11-bin.tar.gz
        curl --fail --silent --show-error --location --retry 3 \
          --output "$archive" "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.11/$archive"
        echo "bcfe4fe305c962ace56ac7b5fc7a08b87d5abd8b7e89027ab251069faebee516b0ded8961445d6d91ec1985dfe30f8153268843c89aa392733d1a3ec956c9978  $archive" | sha512sum --check
        tar -xzf "$archive"
        echo "$maven_dir/apache-maven-3.9.11/bin" >> "$GITHUB_PATH"
    - name: Build
      run: mvn -B -e -Papache-release -Dgpg.skip=true install site
    - name: Remove Snapshots
      run: find ~/.m2/repository -name '*-SNAPSHOT' -a -type d -print0 | xargs -0 rm -rf
